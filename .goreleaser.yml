version: 2
project_name: patchboard

builds:
  - id: patchboard
    main: ./cmd/patchboard
    binary: patchboard
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X gitlab.com/off-peak.engineer/utilities/patchboard/internal/cli.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - LICENSE.MIT
      - LICENSE.zlib
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: git

release:
  gitlab:
    owner: off-peak.engineer/utilities
    name: patchboard
  name_template: "PatchBoard v{{ .Version }}"

gitlab_urls:
  use_package_registry: true
  use_job_token: true
