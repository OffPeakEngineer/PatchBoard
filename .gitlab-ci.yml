workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [test, build, release]

default:
  image: golang:1.25

variables:
  GIT_DEPTH: "0"
  GOTOOLCHAIN: local
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"

cache:
  key:
    files: [go.sum]
    prefix: go-1.25
  paths:
    - .cache/go-build/
    - .cache/go-mod/

test:
  stage: test
  script:
    - sh scripts/check-version.sh
    - go mod download
    - go test -race ./...
    - go vet ./...
    - go run ./cmd/patchboard lint

snapshot:
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success
  script:
    - sh scripts/install-goreleaser.sh
    - ./.cache/bin/goreleaser check
    - ./.cache/bin/goreleaser release --snapshot --clean
  artifacts:
    name: "patchboard-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/*.tar.gz
      - dist/*.zip
      - dist/checksums.txt
    expire_in: 1 week

# Only a successful main push can create a new version tag. The API-created
# tag starts its own tested release pipeline. MR pipelines never publish.
prepare-release:
  stage: release
  resource_group: release
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
  script:
    - sh scripts/create-release-tag.sh

release:
  stage: release
  resource_group: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'
  script:
    - sh scripts/check-version.sh
    - sh scripts/install-goreleaser.sh
    - ./.cache/bin/goreleaser check
    - GITLAB_TOKEN="$CI_JOB_TOKEN" ./.cache/bin/goreleaser release --clean --release-notes "releases/$CI_COMMIT_TAG.md"
  artifacts:
    paths:
      - dist/*.tar.gz
      - dist/*.zip
      - dist/checksums.txt
    expire_in: 1 week
