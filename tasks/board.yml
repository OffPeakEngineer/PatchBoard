task_root: tasks
states:
  - -1_anti-feature
  - 0_planning
  - 1_ready
  - 2_doing
  - 3_done
done_states:
  - -1_anti-feature
  - 3_done
filename:
  enabled: true
  pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*\\.md$"
  description: "slug.md"
  severity: warning
# Keep CI dependency caches and the published task snapshot out of annotation scans.
ignore_dirs:
  - .git
  - node_modules
  - vendor
  - dist
  - build
  - .cache
  - public
