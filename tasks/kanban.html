<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PatchBoard</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f4;
      --panel: #ffffff;
      --panel-2: #f0f3f6;
      --text: #1f252b;
      --muted: #68727d;
      --line: #d9dee3;
      --accent: #167568;
      --danger: #b23b3b;
      --shadow: 0 1px 3px rgb(18 25 33 / 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171a1d;
        --panel: #22272c;
        --panel-2: #1c2024;
        --text: #eef1f3;
        --muted: #a5aeb7;
        --line: #37404a;
        --accent: #5bc2b3;
        --danger: #f07f7f;
        --shadow: 0 1px 3px rgb(0 0 0 / 0.35);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button, select {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }

    button {
      padding: 0 12px;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    button.primary {
      border-color: color-mix(in srgb, var(--accent), #000 10%);
      background: var(--accent);
      color: #fff;
    }

    select { padding: 0 8px; }

    #status {
      min-height: 24px;
      padding: 8px 18px;
      color: var(--muted);
    }

    #status.error { color: var(--danger); }

    main {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(260px, 1fr);
      gap: 12px;
      align-items: start;
      min-height: calc(100vh - 101px);
      overflow-x: auto;
      padding: 0 18px 18px;
    }

    .lane {
      min-height: 240px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      overflow: hidden;
    }

    .lane.over { outline: 2px solid var(--accent); outline-offset: 2px; }

    .lane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      font-weight: 650;
    }

    .count {
      min-width: 24px;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    .cards {
      display: grid;
      gap: 8px;
      padding: 10px;
      min-height: 180px;
    }

    .card {
      display: grid;
      gap: 6px;
      min-height: 78px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      cursor: grab;
    }

    .card:active { cursor: grabbing; }
    .card[draggable="false"] { cursor: default; }

    .title {
      overflow-wrap: anywhere;
      font-weight: 620;
    }

    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .file-link {
      min-height: 28px;
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      text-decoration: none;
      font-size: 12px;
    }

    .empty {
      padding: 12px;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1 data-i18n="appTitle">PatchBoard</h1>
    <div class="toolbar">
      <select id="language" aria-label="Language"></select>
      <button id="open" class="primary" data-i18n="chooseFolderAction">Choose tasks folder</button>
      <button id="change" data-i18n="changeFolderAction" hidden>Change folder</button>
      <button id="refresh" data-i18n="refresh" hidden>Refresh</button>
      <button id="undo" data-i18n="undoMove" hidden>Undo move</button>
      <button id="forget" data-i18n="forgetFolder" hidden>Forget folder</button>
      <button id="install" data-i18n="installApp" hidden>Install app</button>
    </div>
  </header>
  <div id="status" data-i18n="chooseFolder">Choose this project's tasks folder to load the board.</div>
  <main id="board" aria-live="polite"></main>

  <script>
    const messages = {
      en: {
        appTitle: "PatchBoard",
        chooseFolderAction: "Choose tasks folder",
        reconnectFolderAction: "Reconnect tasks folder",
        changeFolderAction: "Change folder",
        forgetFolder: "Forget folder",
        refresh: "Refresh",
        chooseFolder: "Choose this project's tasks folder to load the board.",
        reconnectFolder: "Reconnect the remembered tasks folder to load the board.",
        readOnly: "Board loaded read-only. Reconnect the folder to enable moves.",
        unsupported: "This browser cannot open local task folders. Use a browser with File System Access support or use the PatchBoard CLI.",
        loaded: "Board loaded and writable.",
        loadedNotRemembered: "Board loaded, but this browser could not remember the folder.",
        folderForgotten: "Remembered folder removed. Choose a tasks folder to continue.",
        staleFolder: "The remembered folder is no longer available. Reconnect it, change folders, or forget it.",
        permissionDenied: "Folder access was not granted. Reconnect it or choose a different folder.",
        wrongFolder: "That does not look like a PatchBoard tasks folder. Choose the folder containing board.yml and the state folders.",
        openFailed: "The folder could not be opened. Try reconnecting it or choose a different folder.",
        moved: "Moved card.",
        undoMove: "Undo move",
        undone: "Move undone.",
        undoUnavailable: "There is no browser move to undo.",
        installApp: "Install app",
        moveFailed: "Move failed. Check browser permissions and try again.",
        noTasks: "No tasks",
        noStates: "No state folders found.",
        cardId: "ID",
        file: "File",
        openFile: "Open"
      },
      es: {
        appTitle: "PatchBoard",
        chooseFolderAction: "Elegir carpeta de tareas",
        reconnectFolderAction: "Reconectar carpeta de tareas",
        changeFolderAction: "Cambiar carpeta",
        forgetFolder: "Olvidar carpeta",
        refresh: "Actualizar",
        chooseFolder: "Elige la carpeta de tareas de este proyecto para cargar el tablero.",
        reconnectFolder: "Reconecta la carpeta de tareas recordada para cargar el tablero.",
        readOnly: "Tablero cargado en modo de solo lectura. Reconecta la carpeta para habilitar movimientos.",
        unsupported: "Este navegador no puede abrir carpetas de tareas locales. Usa un navegador compatible con File System Access o la CLI de PatchBoard.",
        loaded: "Tablero cargado con acceso de escritura.",
        loadedNotRemembered: "Tablero cargado, pero este navegador no pudo recordar la carpeta.",
        folderForgotten: "Se elimino la carpeta recordada. Elige una carpeta de tareas para continuar.",
        staleFolder: "La carpeta recordada ya no esta disponible. Reconectala, cambia de carpeta u olvidala.",
        permissionDenied: "No se concedio acceso a la carpeta. Reconectala o elige otra carpeta.",
        wrongFolder: "Esta no parece una carpeta de tareas de PatchBoard. Elige la carpeta que contiene board.yml y las carpetas de estado.",
        openFailed: "No se pudo abrir la carpeta. Intenta reconectarla o elige otra carpeta.",
        moved: "Tarjeta movida.",
        undoMove: "Deshacer movimiento",
        undone: "Movimiento deshecho.",
        undoUnavailable: "No hay un movimiento del navegador para deshacer.",
        installApp: "Instalar app",
        moveFailed: "No se pudo mover. Revisa los permisos del navegador e intenta de nuevo.",
        noTasks: "Sin tareas",
        noStates: "No se encontraron carpetas de estado.",
        cardId: "ID",
        file: "Archivo",
        openFile: "Abrir"
      }
    };

    let lang = pickLanguage();
    let rootHandle = null;
    let board = { states: [], tasks: [] };
    let draggedPath = "";
    let lastMove = null;
    let installPrompt = null;
    let accessMode = "empty";
    let rememberedHandle = false;
    let statusKey = "chooseFolder";
    let statusError = false;

    const boardEl = document.querySelector("#board");
    const statusEl = document.querySelector("#status");
    const languageEl = document.querySelector("#language");
    const openEl = document.querySelector("#open");
    const changeEl = document.querySelector("#change");
    const refreshEl = document.querySelector("#refresh");
    const undoEl = document.querySelector("#undo");
    const forgetEl = document.querySelector("#forget");
    const installEl = document.querySelector("#install");

    initLanguage();
    openEl.addEventListener("click", openFolder);
    changeEl.addEventListener("click", chooseFolder);
    refreshEl.addEventListener("click", refresh);
    undoEl.addEventListener("click", undoLastMove);
    forgetEl.addEventListener("click", forgetFolder);
    installEl.addEventListener("click", installApp);
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPrompt = event;
      updateControls();
    });

    if (!("showDirectoryPicker" in window)) {
      accessMode = "unsupported";
      setStatus("unsupported", true);
    } else {
      void restoreFolder();
    }
    updateControls();

    function pickLanguage() {
      const saved = localStorage.getItem("patchboard.language");
      if (saved && messages[saved]) return saved;
      for (const value of navigator.languages || [navigator.language]) {
        const code = String(value || "").toLowerCase().split("-")[0];
        if (messages[code]) return code;
      }
      return "en";
    }

    function initLanguage() {
      for (const code of Object.keys(messages)) {
        const option = document.createElement("option");
        option.value = code;
        option.textContent = code.toUpperCase();
        languageEl.append(option);
      }
      languageEl.value = lang;
      languageEl.addEventListener("change", () => {
        lang = languageEl.value;
        localStorage.setItem("patchboard.language", lang);
        translate();
        render();
      });
      translate();
    }

    function translate() {
      document.documentElement.lang = lang;
      for (const el of document.querySelectorAll("[data-i18n]")) {
        el.textContent = t(el.dataset.i18n);
      }
      renderStatus();
      updateControls();
    }

    function t(key) {
      return (messages[lang] && messages[lang][key]) || messages.en[key] || key;
    }

    async function openFolder() {
      if (!("showDirectoryPicker" in window)) {
        setStatus("unsupported", true);
        return;
      }
      if (rootHandle && (accessMode === "reconnect" || accessMode === "readonly")) {
        await reconnectFolder();
        return;
      }
      await chooseFolder();
    }

    async function chooseFolder() {
      try {
        const handle = await window.showDirectoryPicker({ id: "patchboard-tasks", mode: "readwrite" });
        await loadHandle(handle, "writable", true);
      } catch (error) {
        if (error && error.name === "AbortError") return;
        handleOpenError(error);
      }
    }

    async function restoreFolder() {
      let handle = null;
      try {
        handle = await storedFolder();
        if (!handle) return;
        rootHandle = handle;
        rememberedHandle = true;
        const writePermission = await queryPermission(handle, "readwrite");
        if (writePermission === "granted") {
          await loadHandle(handle, "writable", false);
          return;
        }
        const readPermission = await queryPermission(handle, "read");
        if (readPermission === "granted") {
          await loadHandle(handle, "readonly", false);
          return;
        }
        accessMode = "reconnect";
        setStatus("reconnectFolder");
        updateControls();
      } catch (error) {
        rootHandle = handle;
        rememberedHandle = Boolean(handle);
        accessMode = "reconnect";
        setStatus("staleFolder", true);
        updateControls();
      }
    }

    async function reconnectFolder() {
      try {
        const permission = await requestPermission(rootHandle, "readwrite");
        if (permission === "granted") {
          await loadHandle(rootHandle, "writable", false);
          return;
        }
        const readPermission = await queryPermission(rootHandle, "read");
        if (readPermission === "granted") {
          await loadHandle(rootHandle, "readonly", false);
          return;
        }
        accessMode = "reconnect";
        setStatus("permissionDenied", true);
        updateControls();
      } catch (error) {
        handleOpenError(error);
      }
    }

    async function loadHandle(handle, mode, remember) {
      const nextBoard = await readBoard(handle);
      rootHandle = handle;
      board = nextBoard;
      accessMode = mode;
      lastMove = null;
      render();
      let remembered = rememberedHandle;
      if (remember) {
        remembered = await saveFolder(handle);
        rememberedHandle = remembered;
      }
      setStatus(remember && !remembered ? "loadedNotRemembered" : mode === "writable" ? "loaded" : "readOnly");
      updateControls();
    }

    function handleOpenError(error) {
      console.error(error);
      if (error && error.code === "PATCHBOARD_WRONG_FOLDER") {
        setStatus("wrongFolder", true);
      } else if (error && (error.name === "NotFoundError" || error.name === "NotReadableError")) {
        accessMode = "reconnect";
        setStatus("staleFolder", true);
      } else if (error && error.name === "NotAllowedError") {
        accessMode = "reconnect";
        setStatus("permissionDenied", true);
      } else {
        setStatus("openFailed", true);
      }
      updateControls();
    }

    async function refresh() {
      if (!rootHandle) {
        setStatus("chooseFolder");
        return;
      }
      try {
        board = await readBoard(rootHandle);
        render();
        setStatus(accessMode === "writable" ? "loaded" : "readOnly");
      } catch (error) {
        handleOpenError(error);
      }
    }

    async function readBoard(handle) {
      const entries = [];
      for await (const [name, child] of handle.entries()) {
        entries.push([name, child]);
      }

      const config = await readConfiguredStates(handle);
      const dirs = entries
        .filter(([name, child]) => child.kind === "directory" && !name.startsWith("."))
        .map(([name]) => name);
      if (!looksLikeTaskRoot(config, dirs)) {
        const error = new Error("selected directory is not a PatchBoard task root");
        error.code = "PATCHBOARD_WRONG_FOLDER";
        throw error;
      }
      const states = config.states.length ? config.states.filter((state) => dirs.includes(state)) : dirs.sort();
      const tasks = [];

      for (const state of states) {
        const dir = await handle.getDirectoryHandle(state);
        for await (const [name, child] of dir.entries()) {
          if (child.kind !== "file" || !name.endsWith(".md") || name.startsWith(".")) continue;
          const file = await child.getFile();
          const text = await file.text();
          tasks.push(parseTask(state, name, text));
        }
      }
      return { states, tasks };
    }

    async function readConfiguredStates(handle) {
      try {
        const file = await (await handle.getFileHandle("board.yml")).getFile();
        return { found: true, states: parseStates(await file.text()) };
      } catch (error) {
        if (error && error.name !== "NotFoundError") throw error;
      }
      return { found: false, states: [] };
    }

    function looksLikeTaskRoot(config, dirs) {
      if (config.found) {
        return config.states.length > 0 && config.states.some((state) => dirs.includes(state));
      }
      const commonStates = new Set([
        "-1_anti-feature", "0_planning", "1_ready", "2_doing", "3_done",
        "backlog", "ready", "doing", "blocked", "done", "archived"
      ]);
      return dirs.filter((name) => commonStates.has(name)).length >= 2;
    }

    function parseStates(text) {
      const states = [];
      let inStates = false;
      for (const line of text.split(/\r?\n/)) {
        if (/^\s*states:\s*$/.test(line)) {
          inStates = true;
          continue;
        }
        if (inStates && /^\S/.test(line)) break;
        const match = line.match(/^\s*-\s+(.+?)\s*$/);
        if (inStates && match) states.push(match[1].replace(/^["']|["']$/g, ""));
      }
      return states;
    }

    function parseTask(state, file, text) {
      const slug = file.replace(/\.md$/, "");
      const title = firstHeading(text) || frontmatter(text, "title") || slug.replaceAll("-", " ");
      return {
        id: frontmatter(text, "id") || slug,
        title,
        state,
        file,
        path: `${state}/${file}`,
        href: encodeURI(`${state}/${file}`)
      };
    }

    function firstHeading(text) {
      const line = text.split(/\r?\n/).find((value) => value.startsWith("# "));
      return line ? line.replace(/^#\s+/, "").trim() : "";
    }

    function frontmatter(text, key) {
      if (!text.startsWith("---\n")) return "";
      const end = text.indexOf("\n---", 4);
      if (end < 0) return "";
      const pattern = new RegExp(`^${key}:\\s*(.+)$`, "m");
      const match = text.slice(4, end).match(pattern);
      return match ? match[1].trim().replace(/^["']|["']$/g, "") : "";
    }

    function render() {
      boardEl.replaceChildren();
      if (!board.states.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = t("noStates");
        boardEl.append(empty);
        return;
      }

      for (const state of board.states) {
        const lane = document.createElement("section");
        lane.className = "lane";
        lane.dataset.state = state;
        if (accessMode === "writable") {
          lane.addEventListener("dragover", onDragOver);
          lane.addEventListener("dragleave", () => lane.classList.remove("over"));
          lane.addEventListener("drop", onDrop);
        }

        const laneTasks = board.tasks.filter((task) => task.state === state).sort((a, b) => a.title.localeCompare(b.title));
        lane.append(laneHeader(state, laneTasks.length));
        const cards = document.createElement("div");
        cards.className = "cards";
        if (!laneTasks.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = t("noTasks");
          cards.append(empty);
        }
        for (const task of laneTasks) cards.append(card(task));
        lane.append(cards);
        boardEl.append(lane);
      }
    }

    function laneHeader(state, count) {
      const header = document.createElement("div");
      header.className = "lane-header";
      const name = document.createElement("span");
      name.textContent = state;
      const badge = document.createElement("span");
      badge.className = "count";
      badge.textContent = count;
      header.append(name, badge);
      return header;
    }

    function card(task) {
      const el = document.createElement("article");
      el.className = "card";
      el.draggable = accessMode === "writable";
      el.dataset.path = task.path;
      el.addEventListener("dragstart", () => {
        draggedPath = task.path;
      });
      el.addEventListener("dblclick", (event) => {
        if (event.target.closest("a")) return;
        window.open(task.href, "_blank", "noopener");
      });

      const title = document.createElement("div");
      title.className = "title";
      title.textContent = task.title;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.append(metaItem(t("cardId"), task.id), metaItem(t("file"), task.file));
      const actions = document.createElement("div");
      actions.className = "card-actions";
      const link = document.createElement("a");
      link.className = "file-link";
      link.href = task.href;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = t("openFile");
      actions.append(link);
      el.append(title, meta, actions);
      return el;
    }

    function metaItem(label, value) {
      const el = document.createElement("span");
      el.textContent = `${label}: ${value}`;
      return el;
    }

    function onDragOver(event) {
      event.preventDefault();
      event.currentTarget.classList.add("over");
    }

    async function onDrop(event) {
      event.preventDefault();
      const lane = event.currentTarget;
      lane.classList.remove("over");
      const targetState = lane.dataset.state;
      const task = board.tasks.find((candidate) => candidate.path === draggedPath);
      if (!task || task.state === targetState) return;

      try {
        await moveTask(task, targetState);
        lastMove = { file: task.file, from: task.state, to: targetState };
        updateControls();
        setStatus("moved");
        await refresh();
      } catch (error) {
        console.error(error);
        setStatus("moveFailed", true);
      }
    }

    async function undoLastMove() {
      if (!lastMove) {
        setStatus("undoUnavailable", true);
        return;
      }
      try {
        await moveTask({ file: lastMove.file, state: lastMove.to }, lastMove.from);
        lastMove = null;
        updateControls();
        setStatus("undone");
        await refresh();
      } catch (error) {
        console.error(error);
        setStatus("moveFailed", true);
      }
    }

    async function moveTask(task, targetState) {
      const fromDir = await rootHandle.getDirectoryHandle(task.state);
      const toDir = await rootHandle.getDirectoryHandle(targetState);
      const source = await fromDir.getFileHandle(task.file);
      const file = await source.getFile();
      const target = await toDir.getFileHandle(task.file, { create: true });
      const writable = await target.createWritable();
      await writable.write(await file.arrayBuffer());
      await writable.close();
      await fromDir.removeEntry(task.file);
    }

    async function installApp() {
      if (!installPrompt) return;
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      updateControls();
    }

    async function queryPermission(handle, mode) {
      if (!handle || typeof handle.queryPermission !== "function") return "prompt";
      return handle.queryPermission({ mode });
    }

    async function requestPermission(handle, mode) {
      if (!handle || typeof handle.requestPermission !== "function") return "denied";
      return handle.requestPermission({ mode });
    }

    function folderStorageKey() {
      return `folder:${window.location.href.split("#")[0]}`;
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        if (!("indexedDB" in window)) {
          reject(new Error("IndexedDB is unavailable"));
          return;
        }
        const request = indexedDB.open("patchboard", 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains("settings")) db.createObjectStore("settings");
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function storedFolder() {
      const db = await openDatabase();
      try {
        return await new Promise((resolve, reject) => {
          const request = db.transaction("settings").objectStore("settings").get(folderStorageKey());
          request.onsuccess = () => resolve(request.result || null);
          request.onerror = () => reject(request.error);
        });
      } finally {
        db.close();
      }
    }

    async function saveFolder(handle) {
      try {
        const db = await openDatabase();
        try {
          await new Promise((resolve, reject) => {
            const request = db.transaction("settings", "readwrite").objectStore("settings").put(handle, folderStorageKey());
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
          });
          return true;
        } finally {
          db.close();
        }
      } catch (error) {
        console.warn("PatchBoard could not remember the selected folder.", error);
        return false;
      }
    }

    async function forgetFolder() {
      try {
        const db = await openDatabase();
        try {
          await new Promise((resolve, reject) => {
            const request = db.transaction("settings", "readwrite").objectStore("settings").delete(folderStorageKey());
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
          });
        } finally {
          db.close();
        }
      } catch (error) {
        console.warn("PatchBoard could not remove the remembered folder.", error);
      }
      rootHandle = null;
      rememberedHandle = false;
      accessMode = "empty";
      lastMove = null;
      board = { states: [], tasks: [] };
      render();
      setStatus("folderForgotten");
      updateControls();
    }

    function setStatus(key, error = false) {
      statusKey = key;
      statusError = error;
      renderStatus();
    }

    function renderStatus() {
      statusEl.textContent = t(statusKey);
      statusEl.classList.toggle("error", statusError);
    }

    function updateControls() {
      const unsupported = accessMode === "unsupported";
      const reconnect = accessMode === "reconnect" || accessMode === "readonly";
      const loaded = accessMode === "writable";
      openEl.hidden = unsupported;
      openEl.dataset.i18n = reconnect ? "reconnectFolderAction" : loaded ? "changeFolderAction" : "chooseFolderAction";
      openEl.textContent = t(openEl.dataset.i18n);
      changeEl.hidden = !reconnect;
      refreshEl.hidden = !rootHandle || accessMode === "reconnect";
      refreshEl.disabled = !rootHandle;
      undoEl.hidden = !lastMove || accessMode !== "writable";
      forgetEl.hidden = !rootHandle && !rememberedHandle;
      installEl.hidden = !installPrompt;
    }
  </script>
</body>
</html>
