name: Publish task board
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

env:
  # A commit or release containing the built-in summary command can also be used.
  PATCHBOARD_REF: main
  TASK_DIRECTORY: tasks

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this project's tasks
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out PatchBoard's export tooling
        uses: actions/checkout@v7
        with:
          repository: OffPeakEngineer/PatchBoard
          ref: ${{ env.PATCHBOARD_REF }}
          path: .patchboard-tools
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .patchboard-tools/go.mod
          cache-dependency-path: .patchboard-tools/go.sum
      - name: Build PatchBoard
        working-directory: .patchboard-tools
        run: go build -o patchboard ./cmd/patchboard
      - name: Render this project's board
        run: ./.patchboard-tools/patchboard -C "$TASK_DIRECTORY" summary --type=html --output public/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
