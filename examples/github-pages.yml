name: Publish task board
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

env:
  # Update this pin when upgrading the exporter and your board template.
  PATCHBOARD_REF: 097f0d865eec8c7e0151efd270132b5cf4f95a06
  TASK_DIRECTORY: tasks

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this project's tasks
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out PatchBoard's export tooling
        uses: actions/checkout@v7
        with:
          repository: OffPeakEngineer/PatchBoard
          ref: ${{ env.PATCHBOARD_REF }}
          path: .patchboard-tools
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: current
          check-latest: true
          cache: npm
          cache-dependency-path: .patchboard-tools/package-lock.json
      - name: Install exporter and Chromium
        working-directory: .patchboard-tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Render this project's board
        run: node .patchboard-tools/scripts/export-board.mjs "$TASK_DIRECTORY" public/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
