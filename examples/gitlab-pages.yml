# Copy to .gitlab/patchboard-pages.yml, then include it from .gitlab-ci.yml.
# Uses standard build/deploy stages; see README if your pipeline customizes them.
patchboard-build:
  stage: build
  image: golang:1.25
  # Do not inherit an application's setup, caches, or build artifacts.
  inherit:
    default: false
  dependencies: []
  variables:
    PATCHBOARD_REF: main
    TASK_DIRECTORY: tasks
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
  script:
    - git init .patchboard-tools
    - git -C .patchboard-tools remote add origin https://github.com/OffPeakEngineer/PatchBoard.git
    - git -C .patchboard-tools fetch --depth=1 origin "$PATCHBOARD_REF"
    - git -C .patchboard-tools checkout --detach FETCH_HEAD
    - go -C .patchboard-tools build -o patchboard ./cmd/patchboard
    - ./.patchboard-tools/patchboard -C "$TASK_DIRECTORY" summary --type=html --output public/index.html
  artifacts:
    paths: [public/]
    expire_in: 1 week

patchboard-pages:
  stage: deploy
  image: golang:1.25
  inherit:
    default: false
  resource_group: pages
  needs:
    - job: patchboard-build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
  script:
    - test -s public/index.html
  pages:
    publish: public
  artifacts:
    paths: [public/]
